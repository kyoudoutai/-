<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缶バッジ制作所</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body { text-align: center; font-family: 'Zen Maru Gothic', sans-serif !important; background-color: #ffffff; padding: 40px 20px; }
        .editor-wrapper {
            position: relative; width: 320px; height: 320px; margin: 0 auto 30px;
            background: #f0f0f0; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .initial-guide {
            position: absolute; width: 240px; height: 240px;
            border: 2px dashed #ccc; border-radius: 50%; z-index: 5; pointer-events: none;
        }
        .initial-guide::after {
            content: "56mmの缶バッジが\A 作れます";
            white-space: pre-wrap; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 12px; line-height: 1.6; color: #aaa; letter-spacing: 0.1em;
        }
        /* Cropperの設定 */
        .cropper-view-box { border-radius: 50%; outline: 5mm solid rgba(0, 0, 0, 0.4); outline-offset: -5mm; box-shadow: 0 0 0 500px rgba(0, 0, 0, 0.4); }
        .cropper-face { background-color: transparent !important; opacity: 1; }
        .cropper-dashed, .cropper-point, .cropper-line, .cropper-center { display: none !important; }

        input[type="file"] { margin-bottom: 20px; }
        .print-btn { display: none; padding: 12px 40px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 30px; border: none; background: #28a745; color: #fff; margin: 20px auto; }
        .note-text { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.6; }

        /* ★【重要】問題のグレーの円を「最初は絶対に出さない」設定 */
        #print-area { display: none; } 

        @media print {
            @page { size: 89mm 127mm; margin: 0; }
            body { width: 89mm; height: 127mm; margin: 0 !important; padding: 0 !important; overflow: hidden; -webkit-print-color-adjust: exact; }
            #print-area {
                display: block !important; /* 印刷するときだけ出す */
                position: absolute; top: 0; left: 0; width: 89mm !important;
            }
            .cut-line {
                width: 66mm; height: 66mm; border: 0.1mm solid #bbb; border-radius: 50%;
                display: flex !important; align-items: center; justify-content: center;
                overflow: hidden; margin: 0 auto;
            }
            .printed-image { width: 100%; height: 100%; object-fit: cover; }
            h1, .editor-wrapper, #file-input, .print-btn, #rotate-container, .note-text { display: none !important; }
        }

        /* 画面確認用のスタイル（一応） */
        .cut-line { width: 66mm; height: 66mm; border: 0.1mm solid #bbb; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; }
        .printed-image { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <h1>缶バッジ制作所</h1>
    <div class="editor-wrapper">
        <div id="initial-guide" class="initial-guide"></div>
        <img id="target-image" style="display: block; max-width: 100%;">
    </div>
    <input type="file" id="file-input" accept="image/*">
    <button id="print-btn" class="print-btn">印刷用データ作成</button>
    <div id="rotate-container" style="margin: 20px 0; display: none;">
        <p style="font-size: 12px; color: #666; margin-bottom: 8px;">画像を回す</p>
        <input type="range" id="rotate-slider" min="-180" max="180" value="0" style="width: 200px;">
    </div>
    <div class="note-text">
        明るい円の内側がバッジの表面になります<br>
        周りの暗い部分は裏側に巻き込まれます
    </div>

    <!-- ここを丸ごと印刷時以外非表示にしました -->
    <div id="print-area">
        <div class="cut-line">
            <img id="output-image" class="printed-image">
        </div>
    </div>

    <script>
        let cropper;
        const fileInput = document.getElementById('file-input');
        const image = document.getElementById('target-image');
        const guide = document.getElementById('initial-guide');
        const printBtn = document.getElementById('print-btn');
        const outputImage = document.getElementById('output-image');
        const rotateSlider = document.getElementById('rotate-slider');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                image.src = event.target.result;
                guide.style.display = 'none';
                printBtn.style.display = 'inline-block';
                document.getElementById('rotate-container').style.display = 'block';
                rotateSlider.value = 0;
                if (cropper) { cropper.destroy(); }
                cropper = new Cropper(image, {
                    aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.85,
                    guides: false, center: false, highlight: false,
                    cropBoxMovable: false, cropBoxResizable: false, background: false, modal: false
                });
            };
            reader.readAsDataURL(file);
        });

        rotateSlider.addEventListener('input', (e) => {
            if (cropper) { cropper.rotateTo(e.target.value); }
        });

        printBtn.addEventListener('click', () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 1500, height: 1500 });
            outputImage.onload = () => { window.print(); };
            outputImage.src = canvas.toDataURL('image/png');
        });
    </script>
</body>
</html>
