<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缶バッジ制作所</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body { text-align: center; font-family: 'Zen Maru Gothic', sans-serif !important; background-color: #ffffff; padding: 20px; margin: 0; }
        .editor-wrapper { position: relative; width: 320px; height: 320px; margin: 0 auto 20px; background: #f0f0f0; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .initial-guide { position: absolute; width: 240px; height: 240px; border: 2px dashed #ccc; border-radius: 50%; z-index: 5; pointer-events: none; }
        .initial-guide::after { content: "56mmの缶バッジが\A 作れます"; white-space: pre-wrap; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; line-height: 1.6; color: #aaa; letter-spacing: 0.1em; }
        .cropper-view-box { border-radius: 50%; outline: 5.2mm solid rgba(0, 0, 0, 0.4); outline-offset: -5.2mm; box-shadow: 0 0 0 500px rgba(0, 0, 0, 0.4); }
        .cropper-face { background-color: transparent !important; }
        .cropper-dashed, .cropper-point, .cropper-line, .cropper-center { display: none !important; }
        .print-btn { display: none; padding: 12px 40px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 30px; border: none; background: #28a745; color: #fff; margin: 10px auto; }
        .note-text { font-size: 11px; color: #999; line-height: 1.6; }
        #rotate-container { margin: 15px 0; display: none; }
        #print-canvas-container { display: none; }

        @media print {
            @page { size: 89mm 127mm; margin: 0; }
            html, body { width: 89mm; height: 127mm; margin: 0 !important; padding: 0 !important; overflow: hidden; }
            #print-canvas-container { 
                display: block !important; 
                position: fixed; top: 0; left: 0; width: 89mm; height: 127mm; background: white; z-index: 9999;
            }
            .canvas-wrapper {
                position: relative; width: 89mm; height: 127mm;
            }
            canvas {
                position: absolute;
                top: 10mm; /* 上部余白 */
                left: 11.5mm; /* (89-66)/2 = 11.5mm で中央 */
                width: 66mm !important;
                height: 66mm !important;
            }
            h1, .editor-wrapper, #file-input, .print-btn, #rotate-container, .note-text, .initial-guide { display: none !important; }
        }
    </style>
</head>
<body>
    <h1>缶バッジ制作所</h1>
    <div class="editor-wrapper">
        <div id="initial-guide" class="initial-guide"></div>
        <img id="target-image" style="display: block; max-width: 100%;">
    </div>
    <input type="file" id="file-input" accept="image/*">
    <button id="print-btn" class="print-btn">印刷用データ作成</button>
    <div id="rotate-container">
        <p class="note-text" style="font-size: 13px; color: #ff69b4; font-weight: bold; margin-bottom: 10px;">明るい円の内側が缶バッジになります</p>
        <p style="font-size: 12px; color: #666; margin-bottom: 5px;">画像を回す</p>
        <input type="range" id="rotate-slider" min="-180" max="180" value="0" style="width: 200px;">
    </div>

    <!-- 印刷専用のコンテナ -->
    <div id="print-canvas-container">
        <div id="canvas-wrapper" class="canvas-wrapper"></div>
    </div>

    <script>
        let cropper;
        const fileInput = document.getElementById('file-input');
        const image = document.getElementById('target-image');
        const printBtn = document.getElementById('print-btn');
        const rotateSlider = document.getElementById('rotate-slider');
        const canvasWrapper = document.getElementById('canvas-wrapper');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                image.src = event.target.result;
                document.getElementById('initial-guide').style.display = 'none';
                printBtn.style.display = 'inline-block';
                document.getElementById('rotate-container').style.display = 'block';
                if (cropper) { cropper.destroy(); }
                cropper = new Cropper(image, {
                    aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.85,
                    guides: false, center: false, highlight: false,
                    cropBoxMovable: false, cropBoxResizable: false, background: false, modal: false
                });
            };
            reader.readAsDataURL(file);
        });

        rotateSlider.addEventListener('input', (e) => { if (cropper) { cropper.rotateTo(e.target.value); } });

        printBtn.addEventListener('click', () => {
            if (!cropper) return;

            // 1. 高解像度キャンバスを作成（実寸66mmを300dpi相当で計算）
            const resultCanvas = cropper.getCroppedCanvas({ width: 780, height: 780 });
            
            // 2. 印刷用キャンバスを生成
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 780;
            finalCanvas.height = 780;
            const ctx = finalCanvas.getContext('2d');

            // 3. 円形にクリップして描画
            ctx.beginPath();
            ctx.arc(390, 390, 390, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(resultCanvas, 0, 0, 780, 780);

            // 4. 外枠の線を引く（66mm用）
            ctx.restore();
            ctx.strokeStyle = "#bbb";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(390, 390, 389, 0, Math.PI * 2);
            ctx.stroke();

            // 5. 画面にセットして印刷
            canvasWrapper.innerHTML = '';
            canvasWrapper.appendChild(finalCanvas);
            
            // 6. 実行！
            setTimeout(() => { window.print(); }, 200);
        });
    </script>
</body>
</html>
